plugins {
    id "com.android.application"
}

// Release signing comes from env vars (set in CI). Without them, release falls back to the debug key.
def keystoreFile = System.getenv("LTV_KEYSTORE_FILE")

// "1.2.3" -> versionCode 10203. CI passes the tag; local builds use the defaults.
def appVersionName = System.getenv("LTV_VERSION_NAME") ?: "1.0.0"
def appVersionCode = appVersionName.tokenize(".").collect { it as int }
        .with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace "com.litetv.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "com.litetv.launcher"
        minSdk 28
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv("LTV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LTV_KEY_ALIAS")
                keyPassword System.getenv("LTV_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Release APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build signed release APK
        env:
          LTV_VERSION_NAME: ${{ github.ref_name }}
          LTV_KEYSTORE_BASE64: ${{ secrets.LTV_KEYSTORE_BASE64 }}
          LTV_KEYSTORE_PASSWORD: ${{ secrets.LTV_KEYSTORE_PASSWORD }}
          LTV_KEY_ALIAS: ${{ secrets.LTV_KEY_ALIAS }}
          LTV_KEY_PASSWORD: ${{ secrets.LTV_KEY_PASSWORD }}
        run: |
          export LTV_VERSION_NAME="${LTV_VERSION_NAME#v}"
          export LTV_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$LTV_KEYSTORE_BASE64" | base64 -d > "$LTV_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk lite-tv-launcher.apk

      # Fixed asset name so .../releases/latest/download/lite-tv-launcher.apk always points at the newest build.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" lite-tv-launcher.apk --title "${{ github.ref_name }}" --generate-notes
